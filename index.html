<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
  <meta name="theme-color" content="#1a2a6c">
  <title>PAMIGO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div>
        <h2>PAMIGO</h2>
        <p>
          <i class="fas fa-map-pin" style="color:#ff6b35"></i>
          <span id="locationText">جاري تحديد الموقع...</span>
        </p>
      </div>
    </div>
    <button class="location" id="refreshLocation">🔄 تحديث الموقع</button>
  </div>

  <!-- ============================================================
       شاشة الدخول
  ============================================================ -->
  <div id="authScreen" style="display:none">
    <div class="card login-box">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">🔐 دخول</button>
        <button class="auth-tab" data-tab="signup">📝 حساب جديد</button>
      </div>

      <form id="loginForm">
        <h4 style="text-align:center;margin-bottom:15px;color:var(--primary)">تسجيل الدخول</h4>
        <input type="tel" id="loginPhone" placeholder="📱 رقم الموبايل" autocomplete="tel">
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="🔑 كلمة المرور" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePass('loginPassword', this)" tabindex="-1">👁️</button>
        </div>
        <button type="submit" id="loginBtn" style="margin-top:10px">🚀 دخول</button>
      </form>

      <form id="signupForm" style="display:none">
        <h4 style="text-align:center;margin-bottom:15px;color:var(--primary)">حساب جديد</h4>
        <input type="text" id="signupName" placeholder="👤 الاسم" autocomplete="name">
        <input type="tel" id="signupPhone" placeholder="📱 رقم الموبايل" autocomplete="tel">
        <div class="password-wrap">
          <input type="password" id="signupPassword" placeholder="🔑 كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePass('signupPassword', this)" tabindex="-1">👁️</button>
        </div>
        <select id="signupRole">
          <option value="customer">👤 عميل</option>
          <option value="merchant">🏪 تاجر</option>
        </select>
        <div id="bankCodeGroup" style="display:none">
          <input type="text" id="signupBankCode" placeholder="🔑 البنكود (مثال: MERCH-MNS01)" autocomplete="off" style="text-transform:uppercase">
          <p style="font-size:12px;color:var(--text-muted);margin:4px 0 8px">
            💡 البنكود بتستلمه من إدارة PAMIGO.
          </p>
        </div>
        <button type="submit" id="signupBtn" style="margin-top:10px">📝 إنشاء الحساب</button>
      </form>

      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <!-- ============================================================
       الشاشة الرئيسية
  ============================================================ -->
  <div id="mainScreen" style="display:none">

    <!-- بيانات المستخدم + خروج -->
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:10px">
        <span id="userRole" class="role-badge">-</span>
        <strong id="userName" style="font-size:14px">-</strong>
      </div>
      <button id="logoutBtn" style="width:auto;padding:8px 16px;font-size:13px;background:var(--danger);border-radius:30px">🚪 خروج</button>
    </div>

    <!-- تنبيه التاجر -->
    <div id="merchantBanner" class="card" style="display:none;background:#d1fae5;border-right:4px solid var(--success);padding:12px 16px">
      <strong style="color:#065f46">🏪 متجرك:</strong>
      <span id="merchantName" style="color:#065f46;font-weight:600">-</span>
      <div style="font-size:12px;color:#065f46;margin-top:4px">لوحة التاجر الكاملة هتكون متاحة في المرحلة الجاية.</div>
    </div>

    <!-- التبويبات -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="home">🏠 الرئيسية</button>
      <button class="tab-btn" data-tab="offers">🎁 العروض</button>
    </div>

    <!-- ========== تبويب الرئيسية ========== -->
    <div class="tab-content active" id="tab-home">

      <!-- نطاق البحث -->
      <div class="radius-control">
        <label>🔍 نطاق البحث: <span id="radiusValue">2</span> كم</label>
        <input type="range" id="radiusSlider" min="0.5" max="10" step="0.5" value="2">

        <div style="margin-top:14px;border-top:1px solid #eee;padding-top:12px">
          <label style="font-size:14px;font-weight:600;display:block;margin-bottom:8px">📊 ترتيب النتائج حسب:</label>
          <div class="categories" id="sortOptions" style="margin-bottom:0">
            <button class="category-chip active" data-sort="nearest">📍 الأقرب</button>
            <button class="category-chip" data-sort="cashback">💰 أعلى كاش باك</button>
            <button class="category-chip" data-sort="discount">🔥 أعلى خصم</button>
          </div>
        </div>

        <div style="margin-top:14px;border-top:1px solid #eee;padding-top:12px">
          <label style="font-size:14px;font-weight:600;display:block;margin-bottom:8px">🏷️ نوع الخدمة:</label>
          <div class="categories" id="homeCategories" style="margin-bottom:0">
            <button class="category-chip active" data-cat="all">🌟 الكل</button>
            <button class="category-chip" data-cat="fashion">👗 ملابس</button>
            <button class="category-chip" data-cat="restaurants">🍕 مطاعم</button>
            <button class="category-chip" data-cat="bigfood">🍔 وجبات</button>
            <button class="category-chip" data-cat="electronics">📱 إلكترونيات</button>
            <button class="category-chip" data-cat="car_parts">🛞 قطع غيار</button>
            <button class="category-chip" data-cat="car_accessories">🪞 كماليات</button>
            <button class="category-chip" data-cat="car_repair">🔧 صيانة</button>
            <button class="category-chip" data-cat="clinics">🩺 عيادات</button>
            <button class="category-chip" data-cat="labs">🧪 معامل</button>
            <button class="category-chip" data-cat="radiology">📡 أشعة</button>
            <button class="category-chip" data-cat="hospitals">🏨 مستشفيات</button>
          </div>
        </div>
      </div>

      <!-- البحث -->
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن عروض أو متاجر...">
      </div>

      <!-- أفضل العروض -->
      <div class="section-title"><h3>🔥 أفضل العروض</h3></div>
      <div class="deals-scroll" id="dealsScroll"></div>

      <!-- قائمة المتاجر -->
      <div class="section-title"><h3>📍 المتاجر القريبة</h3></div>
      <div id="merchantsList">
        <div class="no-requests">⏳ جاري التحميل...</div>
      </div>

    </div>

    <!-- ========== تبويب العروض ========== -->
    <div class="tab-content" id="tab-offers">
      <div class="section-title"><h3>🎁 عروض حصرية</h3></div>
      <div class="categories" id="offersCategories">
        <button class="category-chip active" data-cat="all">🌟 الكل</button>
        <button class="category-chip" data-cat="restaurants">🍕 مطاعم</button>
        <button class="category-chip" data-cat="bigfood">🍔 وجبات</button>
        <button class="category-chip" data-cat="fashion">👗 ملابس</button>
        <button class="category-chip" data-cat="electronics">📱 إلكترونيات</button>
        <button class="category-chip" data-cat="car_parts">🛞 قطع غيار</button>
        <button class="category-chip" data-cat="car_accessories">🪞 كماليات</button>
        <button class="category-chip" data-cat="car_repair">🔧 صيانة</button>
        <button class="category-chip" data-cat="clinics">🩺 عيادات</button>
        <button class="category-chip" data-cat="labs">🧪 معامل</button>
        <button class="category-chip" data-cat="radiology">📡 أشعة</button>
        <button class="category-chip" data-cat="hospitals">🏨 مستشفيات</button>
      </div>
      <div class="offers-grid" id="offersGrid"></div>
    </div>

  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="merchantModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeMerchantModal()">✕</button>
      <h3 id="modalMerchantName">اسم التاجر</h3>
      <div class="merchant-info" id="modalMerchantInfo" style="color:#6b7280;font-size:14px;margin-bottom:14px"></div>
      <div id="modalOffersList"></div>
    </div>
  </div>

  <div class="footer">PAMIGO v37.0 — Stage 4-B</div>

  <script type="module" src="app.js"></script>

  <script>
    window.togglePass = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerText = isHidden ? '🙈' : '👁️';
    };
  </script>
</body>
</html>
