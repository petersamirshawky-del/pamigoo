<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
  <meta name="theme-color" content="#1a2a6c">
  <title>PAMIGO — اختبار الاتصال</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <div class="header">
    <div>
      <h2>PAMIGO</h2>
      <p>🔌 اختبار الاتصال بـ Supabase</p>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">1) الاتصال</h3>
    <div id="connStatus" class="status-box">⏳ جاري الاختبار...</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">2) الجداول</h3>
    <div id="tablesStatus">⏳ جاري الفحص...</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">📋 خطواتك التالية</h3>
    <p style="line-height:1.8;color:#4b5563">
      لو كل الجداول طلعت ✅، معنى كده إن المشروع اتربط بنجاح.<br>
      بعدها هنضيف <strong>تسجيل الدخول</strong> وهنبدأ نبني الواجهة الحقيقية.
    </p>
  </div>

  <div class="footer">PAMIGO v37.0 — Skeleton</div>

  <script type="module" src="app.js"></script>
</body>
</html>
